    <script>
      // Gracefully ignore HMR WebSocket errors in AI Studio iframe/proxy environment
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes?.('WebSocket') || (typeof e.filename === 'string' && e.filename.includes('@vite/client')))) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket')) {
          e.preventDefault?.();
          return true;
        }
      });
    </script>
